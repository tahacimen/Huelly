<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Huelly</title>
<style>
/* ============================================================
   HUELLY — hyper-casual color sequence shooter
   Single-file prototype. All tunable values live in CONFIG
   at the top of the <script> below.
   ============================================================ */

:root{
  --bg:#121220;
  --bg2:#1B1B30;
  --panel:#232340;
  --panel2:#2C2C50;
  --ink:#F2F0FF;
  --ink-dim:#8E8CB0;
  --accent:#FFDD3C;
  --good:#2ED573;
  --bad:#FF4757;
  --radius:14px;
  font-size:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif;
  overflow:hidden;
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}

#app{
  max-width:480px;height:100dvh;margin:0 auto;
  display:flex;flex-direction:column;position:relative;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  box-shadow:0 0 60px rgba(0,0,0,.6);
}

.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.screen.active{display:flex}

/* ---------- shared bits ---------- */
.brand{
  text-align:center;font-weight:900;letter-spacing:.06em;line-height:1.05;
  font-size:2rem;text-transform:uppercase;
}
.brand .fire{color:var(--accent)}
.brand-dots{display:flex;gap:6px;justify-content:center;margin:14px 0 6px}
.brand-dots span{width:14px;height:14px;border-radius:4px;animation:bob 1.6s ease-in-out infinite}
.brand-dots span:nth-child(2){animation-delay:.15s}
.brand-dots span:nth-child(3){animation-delay:.3s}
.brand-dots span:nth-child(4){animation-delay:.45s}
.brand-dots span:nth-child(5){animation-delay:.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.btn{
  display:block;width:100%;padding:15px;border-radius:var(--radius);
  background:var(--accent);color:#1A1A00;font-weight:800;font-size:1.05rem;
  letter-spacing:.03em;text-transform:uppercase;
  transition:transform .08s ease,filter .15s;
}
.btn:active{transform:scale(.97);filter:brightness(1.1)}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn:disabled{opacity:.35;pointer-events:none}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.topbar h2{font-size:1.15rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.icon-btn{background:var(--panel);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.85rem;color:var(--ink-dim)}
.icon-btn:active{filter:brightness(1.3)}

/* ---------- signup ---------- */
#screen-signup{justify-content:center;align-items:center;gap:10px;text-align:center}
#screen-signup p{color:var(--ink-dim);font-size:.95rem;max-width:280px;margin-bottom:14px}
#nick-input{
  width:100%;max-width:300px;padding:15px;border-radius:var(--radius);
  border:2px solid var(--panel2);background:var(--panel);color:var(--ink);
  font-size:1.1rem;font-weight:700;text-align:center;outline:none;
}
#nick-input:focus{border-color:var(--accent)}
#nick-error{color:var(--bad);font-size:.85rem;min-height:1.2em;margin-top:4px}
#screen-signup .btn{max-width:300px;margin-top:8px}
/* Language toggle. On sign-up it sits in the corner so a player who cannot
   read the Turkish copy can still find it before doing anything else. */
.lang-btn{
  position:absolute;top:max(14px,env(safe-area-inset-top));right:16px;
  background:var(--panel);border-radius:10px;padding:8px 14px;
  font-weight:800;font-size:.85rem;color:var(--ink-dim);letter-spacing:.06em;
}
.lang-btn:active{filter:brightness(1.4)}

/* ---------- level select ---------- */
#player-chip{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
#player-chip b{font-size:1rem}
#player-chip small{color:var(--ink-dim);font-size:.75rem}
#level-grid{
  flex:1;overflow-y:auto;display:grid;
  grid-template-columns:repeat(4,1fr);gap:10px;
  padding:4px 2px 20px;align-content:start;
}
.lvl{
  aspect-ratio:1;border-radius:var(--radius);background:var(--panel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-weight:800;font-size:1.2rem;position:relative;
  transition:transform .08s;
}
.lvl:active{transform:scale(.94)}
.lvl.locked{opacity:.35;pointer-events:none}
.lvl.locked::after{content:"🔒";font-size:.9rem;position:absolute;bottom:6px}
.lvl .stars{display:flex;gap:3px;height:7px}
.lvl .stars i{width:7px;height:7px;border-radius:50%;background:var(--panel2)}
.lvl .stars i.s1.on{background:var(--good)}
.lvl .stars i.s2.on{background:var(--accent)}
.lvl .stars i.s3.on{background:var(--bad)}
.lvl .stars i.s4.on{background:#A55EEA}
#spd-btn{
  background:var(--panel);border-radius:10px;padding:6px 10px;
  font-weight:900;font-size:.85rem;color:var(--accent);min-width:52px;
}
#spd-btn:active{filter:brightness(1.4)}
#admin-flag{color:#A55EEA;font-weight:900}
.lvl.done{background:var(--panel2);outline:2px solid rgba(255,221,60,.35)}

/* ---------- difficulty ---------- */
#diff-cards{flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center}
.diff-card{
  border-radius:var(--radius);padding:18px;text-align:left;background:var(--panel);
  border:2px solid transparent;display:flex;justify-content:space-between;align-items:center;
  transition:transform .08s;
}
.diff-card:active{transform:scale(.97)}
.diff-card h3{font-size:1.2rem;text-transform:uppercase;letter-spacing:.04em}
.diff-card small{color:var(--ink-dim);display:block;margin-top:4px;font-size:.85rem}
.diff-card .mult{font-size:1.5rem;font-weight:900}
.diff-card.slow{border-color:var(--good)}.diff-card.slow .mult{color:var(--good)}
.diff-card.medium{border-color:var(--accent)}.diff-card.medium .mult{color:var(--accent)}
.diff-card.fast{border-color:var(--bad)}.diff-card.fast .mult{color:var(--bad)}
.diff-card.extreme{border-color:#A55EEA;background:linear-gradient(135deg,var(--panel),#2A1B45)}
.diff-card.extreme .mult{color:#A55EEA}
#diff-best{color:var(--ink-dim);text-align:center;font-size:.85rem;margin-top:12px}

/* ---------- game ---------- */
#screen-game{padding:0}
#hud{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
  font-weight:800;font-size:.95rem;background:rgba(0,0,0,.25);
}
#hud .hud-item{display:flex;flex-direction:column;align-items:center;line-height:1.1}
#hud .hud-item small{font-weight:600;color:var(--ink-dim);font-size:.65rem;text-transform:uppercase;letter-spacing:.08em}
#hud-timer.low{color:var(--bad);animation:pulse .5s infinite}
@keyframes pulse{50%{opacity:.4}}
#btn-quit{color:var(--ink-dim);font-size:1.2rem;padding:4px 8px}

#playfield{flex:1;position:relative;overflow:hidden}
#danger-line{
  position:absolute;left:0;right:0;bottom:0;height:3px;
  background:repeating-linear-gradient(90deg,var(--bad) 0 12px,transparent 12px 24px);
  opacity:.7;
}
.strip{position:absolute;left:0;right:0;display:flex;gap:2px;padding:0 8px;will-change:top}
.strip .cell{flex:1;aspect-ratio:1;max-height:38px;border-radius:6px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
#fire-strip{transition:top .22s cubic-bezier(.2,0,.4,1)}
.particle{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;animation:fade .5s forwards}
@keyframes fade{to{opacity:0;transform:translateY(30px) scale(.3)}}
.boom{position:absolute;font-size:2rem;font-weight:900;color:var(--accent);pointer-events:none;animation:boomUp .6s forwards;text-shadow:0 2px 8px rgba(0,0,0,.5)}
@keyframes boomUp{0%{opacity:0;transform:translateY(6px) scale(.6)}20%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:translateY(-34px) scale(1)}}

#input-zone{padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:rgba(0,0,0,.3)}
#player-grid{display:flex;gap:2px;padding:0 4px;margin-bottom:10px;border-radius:8px}
#player-grid .slot{
  flex:1;aspect-ratio:1;max-height:38px;border-radius:6px;
  background:var(--panel);border:2px dashed var(--panel2);
}
#player-grid .slot.filled{border-style:solid;border-color:rgba(255,255,255,.15);box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
#player-grid.match-ok .slot{border-color:var(--good);box-shadow:0 0 10px var(--good)}
#player-grid.match-bad{animation:shakeX .3s}
@keyframes shakeX{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

#palette{display:flex;gap:8px;margin-bottom:10px}
.pal-btn{
  flex:1;height:58px;border-radius:12px;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.35);
  transition:transform .06s;
}
.pal-btn:active{transform:scale(.9)}
#ctrl-row{display:flex;gap:8px}
#ctrl-row button{
  flex:1;padding:12px;border-radius:12px;background:var(--panel);
  font-weight:800;text-transform:uppercase;font-size:.85rem;letter-spacing:.05em;color:var(--ink-dim);
}
#ctrl-row button:active{filter:brightness(1.4)}

.shake{animation:shakeAll .35s}
@keyframes shakeAll{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(5px,-2px)}}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:5}
#flash.red{background:var(--bad);animation:flashA .35s}
#flash.green{background:var(--good);animation:flashA .3s}
@keyframes flashA{0%{opacity:.35}100%{opacity:0}}

/* ---------- result ---------- */
#screen-result{justify-content:center;align-items:center;text-align:center;gap:8px}
#result-title{font-size:1.9rem;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
#result-sub{color:var(--ink-dim);margin-bottom:6px}
#result-score{font-size:3rem;font-weight:900;color:var(--accent)}
#result-best{color:var(--ink-dim);font-size:.9rem;margin-bottom:18px}
#screen-result .btn{max-width:300px;margin-top:8px}

/* ---------- leaderboard ---------- */
#lb-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:20px}
.lb-row{
  display:flex;align-items:center;gap:12px;background:var(--panel);
  border-radius:12px;padding:12px 14px;font-weight:700;
}
.lb-row .rank{width:2em;text-align:center;color:var(--ink-dim)}
.lb-row.top1 .rank{color:var(--accent)}
.lb-row .nick{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .pts{color:var(--accent)}
.lb-row.me{outline:2px solid var(--accent)}
.lb-empty{color:var(--ink-dim);text-align:center;margin-top:40px}

/* ---------- continue (rewarded-ad revive) overlay ---------- */
#continue-overlay{
  position:absolute;inset:0;z-index:20;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:32px;text-align:center;
  background:rgba(10,10,22,.86);backdrop-filter:blur(3px);
}
#continue-overlay.show{display:flex}
#continue-overlay h3{font-size:1.6rem;font-weight:900;color:var(--bad);text-transform:uppercase;letter-spacing:.03em}
#continue-overlay p{color:var(--ink-dim);max-width:280px}
#continue-overlay .btn{max-width:300px}
#btn-continue{background:var(--good);color:#04220f}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">

  <!-- SIGN UP -->
  <div class="screen active" id="screen-signup">
    <div class="brand-dots">
      <span style="background:#FF4757"></span><span style="background:#FFA502"></span>
      <span style="background:#FFDD3C"></span><span style="background:#2ED573"></span>
      <span style="background:#1E90FF"></span>
    </div>
    <div class="brand">Huel<span class="fire">ly</span></div>
    <p data-i18n="tagline">Düşen renk kodunu yere inmeden kopyala. Eşleştir — otomatik ateşlensin.</p>
    <input id="nick-input" maxlength="14" data-i18n-ph="nickPlaceholder" autocomplete="off">
    <div id="nick-error"></div>
    <button class="btn" id="btn-join" data-i18n="start">Oynamaya başla</button>
    <button class="lang-btn" id="btn-lang-signup">EN</button>
  </div>

  <!-- LEVEL SELECT -->
  <div class="screen" id="screen-levels">
    <div class="topbar">
      <div id="player-chip"><b id="chip-nick"></b><small id="chip-score"></small></div>
      <div style="display:flex;gap:8px">
        <button class="icon-btn" id="btn-lang">EN</button>
        <button class="icon-btn" id="btn-lb" data-i18n="ranks">🏆 Sıralama</button>
        <button class="icon-btn" id="btn-switch" data-i18n="switchPlayer">Değiştir</button>
      </div>
    </div>
    <div id="level-grid"></div>
  </div>

  <!-- DIFFICULTY -->
  <div class="screen" id="screen-diff">
    <div class="topbar">
      <button class="icon-btn" id="btn-diff-back" data-i18n="back">← Geri</button>
      <h2 id="diff-title">Seviye 1</h2>
      <span style="width:64px"></span>
    </div>
    <div id="diff-cards">
      <button class="diff-card slow" data-diff="slow">
        <div><h3 data-i18n="diff_slow">Yavaş</h3><small id="dc-slow"></small></div><div class="mult">×1</div>
      </button>
      <button class="diff-card medium" data-diff="medium">
        <div><h3 data-i18n="diff_medium">Orta</h3><small id="dc-medium"></small></div><div class="mult">×2</div>
      </button>
      <button class="diff-card fast" data-diff="fast">
        <div><h3 data-i18n="diff_fast">Hızlı</h3><small id="dc-fast"></small></div><div class="mult">×3</div>
      </button>
      <button class="diff-card extreme" data-diff="extreme">
        <div><h3 data-i18n="diff_extreme">Ekstrem</h3><small id="dc-extreme"></small></div><div class="mult">×5</div>
      </button>
    </div>
    <div id="diff-best"></div>
  </div>

  <!-- GAME -->
  <div class="screen" id="screen-game">
    <div id="hud">
      <button id="btn-quit">✕</button>
      <div class="hud-item"><small data-i18n="hudLevel">Seviye</small><span id="hud-level">1</span></div>
      <div class="hud-item"><small data-i18n="hudTime">Süre</small><span id="hud-timer">45</span></div>
      <div class="hud-item"><small data-i18n="hudLives">Can</small><span id="hud-lives">❤❤❤</span></div>
      <div class="hud-item"><small data-i18n="hudScore">Skor</small><span id="hud-score">0</span></div>
      <button id="spd-btn" data-i18n-title="speedBoostHint">1×</button>
    </div>
    <div id="playfield">
      <div id="flash"></div>
      <div id="danger-line"></div>
    </div>
    <div id="input-zone">
      <div id="player-grid"></div>
      <div id="palette"></div>
      <div id="ctrl-row">
        <button id="btn-undo" data-i18n="undo">⌫ Geri al</button>
        <button id="btn-clear" data-i18n="clear">Temizle</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="screen-result">
    <div id="result-title"></div>
    <div id="result-sub"></div>
    <div id="result-score"></div>
    <div id="result-best"></div>
    <button class="btn" id="btn-next" data-i18n="nextLevel">Sonraki seviye →</button>
    <button class="btn ghost" id="btn-retry" data-i18n="playAgain">Tekrar oyna</button>
    <button class="btn ghost" id="btn-to-levels" data-i18n="levelMap">Seviye haritası</button>
  </div>

  <!-- LEADERBOARD -->
  <div class="screen" id="screen-lb">
    <div class="topbar">
      <button class="icon-btn" id="btn-lb-back" data-i18n="back">← Geri</button>
      <h2 data-i18n="leaderboard">Sıralama Tablosu</h2>
      <span style="width:64px"></span>
    </div>
    <div id="lb-list"></div>
  </div>

  <!-- CONTINUE (rewarded-ad revive), shown over the game when lives hit 0 -->
  <div id="continue-overlay">
    <h3 data-i18n="continueTitle">Canların bitti!</h3>
    <p data-i18n="continueBody">Kısa bir reklam izle, +1 canla devam et.</p>
    <button class="btn" id="btn-continue" data-i18n="continueWatch">▶ İzle ve devam et</button>
    <button class="btn ghost" id="btn-giveup" data-i18n="continueGiveUp">Vazgeç</button>
  </div>

</div>

<script>
/* ============================================================
   I18N — the gameplay is pure colour matching, so language is only
   a thin shell over a universal core. Adding a locale is just adding
   a dictionary below; nothing else needs to change.
   Static markup is translated via data-i18n / data-i18n-ph /
   data-i18n-title attributes; dynamic strings go through t().
   ============================================================ */
const STRINGS = {
  tr: {
    tagline:'Düşen renk kodunu yere inmeden kopyala. Eşleştir — otomatik ateşlensin.',
    nickPlaceholder:'Takma ad seç',
    start:'Oynamaya başla',
    nickTooShort:'Takma ad en az 3 karakter olmalı.',
    ranks:'🏆 Sıralama',
    switchPlayer:'Değiştir',
    back:'← Geri',
    points:'{n} puan',
    admin:'YÖNETİCİ',
    levelN:'Seviye {n}',
    diff_slow:'Yavaş', diff_medium:'Orta', diff_fast:'Hızlı', diff_extreme:'Ekstrem',
    // Turkish does not inflect the noun after a numeral, so both forms match.
    diffCardOne:'{lives} can · {colors} renk',
    diffCardMany:'{lives} can · {colors} renk',
    diffShuffle:' · butonlar karışır!',
    bestPrefix:'En iyi — ',
    noScores:'Bu seviyede henüz skor yok.',
    hudLevel:'Seviye', hudTime:'Süre', hudLives:'Can', hudScore:'Skor',
    speedBoostHint:'Hız artışı — daha hızlı düşer, daha çok puan',
    undo:'⌫ Geri al',
    clear:'Temizle',
    levelDone:'Seviye tamam!',
    gameOver:'Oyun bitti',
    subCleared:'Seviye {n} · {diff} · süreyi tamamladın',
    subNoMatch:'Seviye {n} · {diff} · hiç eşleştirme yapmadın',
    subOutOfLives:'Seviye {n} · {diff} · canın bitti',
    adminNote:'Yönetici testi — skor kaydedilmez veya sıralanmaz.',
    newBest:'Yeni rekor!',
    newBestWas:'Yeni rekor! (önceki: {prev})',
    best:'En iyi: {n}',
    needAMatch:'Seviyeyi geçmek için en az bir eşleştirme yapmalısın.',
    finishToBank:'Skorunu kaydetmek için süreyi tamamla.',
    nextLevel:'Sonraki seviye →',
    playAgain:'Tekrar oyna',
    levelMap:'Seviye haritası',
    leaderboard:'Sıralama Tablosu',
    loading:'Yükleniyor…',
    lbEmpty:'Henüz sıralanan oyuncu yok.<br>Tabloya girmek için bir seviye tamamla!',
    continueTitle:'Canların bitti!',
    continueBody:'Kısa bir reklam izle, +1 canla devam et.',
    continueWatch:'▶ İzle ve devam et',
    continueGiveUp:'Vazgeç',
  },
  en: {
    tagline:'Copy the falling color code before it lands. Match it — and it fires automatically.',
    nickPlaceholder:'Pick a nickname',
    start:'Start playing',
    nickTooShort:'Nickname needs at least 3 characters.',
    ranks:'🏆 Ranks',
    switchPlayer:'Switch',
    back:'← Back',
    points:'{n} pts',
    admin:'ADMIN',
    levelN:'Level {n}',
    diff_slow:'Slow', diff_medium:'Medium', diff_fast:'Fast', diff_extreme:'Extreme',
    diffCardOne:'{lives} life · {colors} colors',
    diffCardMany:'{lives} lives · {colors} colors',
    diffShuffle:' · buttons shuffle!',
    bestPrefix:'Best — ',
    noScores:'No scores yet on this level.',
    hudLevel:'Level', hudTime:'Time', hudLives:'Lives', hudScore:'Score',
    speedBoostHint:'Speed boost — faster fall, more points',
    undo:'⌫ Undo',
    clear:'Clear',
    levelDone:'Level complete!',
    gameOver:'Game over',
    subCleared:'Level {n} · {diff} · survived the clock',
    subNoMatch:'Level {n} · {diff} · you never matched a strip',
    subOutOfLives:'Level {n} · {diff} · out of lives',
    adminNote:'Admin test — score not saved or ranked.',
    newBest:'New best!',
    newBestWas:'New best! (was {prev})',
    best:'Best: {n}',
    needAMatch:'You need at least one match to clear the level.',
    finishToBank:'Complete the timer to bank your score.',
    nextLevel:'Next level →',
    playAgain:'Play again',
    levelMap:'Level map',
    leaderboard:'Leaderboard',
    loading:'Loading…',
    lbEmpty:'No players ranked yet.<br>Complete a level to get on the board!',
    continueTitle:'Out of lives!',
    continueBody:'Watch a short ad to continue with +1 life.',
    continueWatch:'▶ Watch & continue',
    continueGiveUp:'Give up',
  },
};
const LANGS = ['tr','en'];
let lang = 'tr';

/** Look up a string, filling {placeholders}. Falls back to Turkish, then the key. */
function t(key, vars){
  let s = (STRINGS[lang] && STRINGS[lang][key]) ?? STRINGS.tr[key] ?? key;
  if (vars) for (const k in vars) s = s.split('{'+k+'}').join(vars[k]);
  return s;
}

/** Paint every string that lives in the markup. Safe to call repeatedly. */
function applyI18n(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });

  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {

  });

  const other = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length].toUpperCase();

    const b = document.getElementById(id); if (b) b.textContent = other;
  });

/* ============================================================
   CONFIG — everything you'll want to tweak lives here
   ============================================================ */
const CONFIG = {
  LEVEL_COUNT: 33,                 // add more levels by raising this number
  COLORS: ['#FF4757','#FFA502','#FFDD3C','#2ED573','#00D2D3','#1E90FF','#A55EEA'],

  // Difficulty presets — point multiplier, speed multiplier, lives, extra colors.
  // Display names live in STRINGS as diff_<key>, reached via t('diff_'+key).
  DIFFS: {
    slow:    { mult:1, speed:0.6, lives:3, extraColors:0 },
    medium:  { mult:2, speed:1.0, lives:2, extraColors:1 },
    fast:    { mult:3, speed:1.6, lives:1, extraColors:2 },
    extreme: { mult:5, speed:2.2, lives:1, extraColors:3, shuffle:true }, // shuffle = palette buttons move after every strip
  },
  DIFF_ORDER: ['slow','medium','fast','extreme'],

  // In-game speed booster (available to everyone, on every difficulty).
  // Falling speed AND points earned are multiplied by the chosen boost.
  SPEED_BOOSTS: [1, 1.5, 2, 3],

  // Per-level scaling
  // Capped at 7: past that the strip stops testing reactions and just
  // overruns working memory, which tops out around 7 items.
  seqLen:    lvl => Math.min(3 + Math.floor((lvl - 1) / 6), 7),        // blocks in the strip: 3 → 7
  colorCount:(lvl, d) => Math.min(3 + Math.floor((lvl - 1) / 8) + CONFIG.DIFFS[d].extraColors, 7),
  levelTime: lvl => 30 + Math.min(lvl, 15),                            // seconds to survive: 31 → 45

  // Seconds allowed per block, before the difficulty speed multiplier.
  perBlockTime: lvl => Math.max(2.2 - lvl * 0.035, 1.1),
  // Fall time scales WITH the sequence length. Previously it shrank while the
  // strip grew, so a longer strip was punished twice and level 33 Extreme left
  // 0.31s per block — unplayable. Tying the two together keeps the curve fair.
  fallTime:  (lvl, d) =>
    CONFIG.seqLen(lvl) * CONFIG.perBlockTime(lvl) / CONFIG.DIFFS[d].speed,   // seconds top→bottom

  // Scoring: (20 + 80 × heightFraction) × diffMult × levelBonus
  points: (heightFrac, lvl, d) =>
    Math.round((20 + 80 * heightFrac) * CONFIG.DIFFS[d].mult * (1 + (lvl - 1) * 0.05)),
};

/* ============================================================
   STORAGE — persists progress + shared leaderboard.
   Layered so the game keeps its progress everywhere it runs:
     1. window.storage  — Claude Artifacts (shared leaderboard across players)
     2. localStorage    — real browsers + Android WebView (Capacitor); survives
                          app restarts. This is what a published build uses.
     3. in-memory       — last-resort fallback (e.g. private mode where
                          localStorage is blocked) so the game never crashes.
   Keys are namespaced 'huelly:p:' (personal) / 'huelly:s:' (shared) in
   localStorage so we never collide with anything else on the origin.
   ============================================================ */
const memStore = {};
const LS_PREFIX = 'huelly:';
const hasLS = (() => {
  try { const k='huelly:__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
  catch { return false; }
})();
const lsKey = (key, shared) => LS_PREFIX + (shared?'s:':'p:') + key;

const store = {
  async get(key, shared=false){
    if (window.storage) { try { const r = await window.storage.get(key, shared); return r ? JSON.parse(r.value) : null; } catch { return null; } }
    if (hasLS) { try { const v = localStorage.getItem(lsKey(key, shared)); return v!=null ? JSON.parse(v) : null; } catch { return null; } }
    return memStore[(shared?'s:':'p:')+key] ?? null;
  },
  async set(key, val, shared=false){
    if (window.storage) { try { await window.storage.set(key, JSON.stringify(val), shared); } catch(e){ console.error(e); } return; }
    if (hasLS) { try { localStorage.setItem(lsKey(key, shared), JSON.stringify(val)); } catch(e){ console.error(e); } return; }
    memStore[(shared?'s:':'p:')+key] = val;
  },
  async delete(key, shared=false){
    if (window.storage) { try { await window.storage.delete(key, shared); } catch{} return; }
    if (hasLS) { try { localStorage.removeItem(lsKey(key, shared)); } catch{} return; }
    delete memStore[(shared?'s:':'p:')+key];
  },
  async list(prefix, shared=false){
    if (window.storage) { try { const r = await window.storage.list(prefix, shared); return r ? r.keys : []; } catch { return []; } }
    if (hasLS) {
      try {
        const full = LS_PREFIX + (shared?'s:':'p:') + prefix;
        const out = [];
        for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if (k && k.startsWith(full)) out.push(k.slice((LS_PREFIX+(shared?'s:':'p:')).length)); }
        return out;
      } catch { return []; }
    }
    return Object.keys(memStore).filter(k=>k.startsWith((shared?'s:':'p:')+prefix)).map(k=>k.slice(2));
  },
};

/* ============================================================
   CLOUD LEADERBOARD (Supabase) — real global ranking.
   Talks to the REST API directly (no SDK → single-file stays intact).
   The publishable key is designed to ship in client apps; every write
   goes through the submit_score() RPC, which only ever RAISES a score,
   so a tampered client can't lower anyone (including itself).
   When offline, scores still save locally and sync on the next save.
   ============================================================ */
const SUPA = {
  url: 'https://iokqvjvujdqiaqeeqoat.supabase.co',
  key: 'sb_publishable_IO5SR1tUNCRHSmIX0yruJw_hfE_vWmp',
  enabled: true,
};
const nickId = nick => nick.toLowerCase().replace(/[^a-z0-9_-]/g,'_');

async function cloudSubmit(nick, total){
  if (!SUPA.enabled) return;
  try{
    await fetch(SUPA.url + '/rest/v1/rpc/submit_score', {
      method:'POST',
      headers:{ 'apikey':SUPA.key, 'Authorization':'Bearer '+SUPA.key, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_id: nickId(nick), p_nick: nick, p_total: total }),
    });
  }catch(e){ /* offline — the local copy is already saved, will re-sync next time */ }
}

async function cloudLeaderboard(limit=50){
  if (!SUPA.enabled) return null;
  try{
    const res = await fetch(SUPA.url + '/rest/v1/leaderboard?select=nick,total&order=total.desc&limit='+limit, {
      headers:{ 'apikey':SUPA.key, 'Authorization':'Bearer '+SUPA.key },
    });
    if (!res.ok) return null;
    return await res.json();   // [{ nick, total }, ...] already sorted desc
  }catch(e){ return null; }
}

/* ============================================================
   ADS (AdMob) — an interstitial between games and a rewarded
   "revive" when lives run out. Runs ONLY inside the native app;
   in a browser, or if the plugin is missing, every method is a
   safe no-op, so the game plays identically everywhere else.

   The ad-unit ids below are GOOGLE'S OFFICIAL TEST ids: they serve
   test ads and can NEVER earn money. To go live, replace these AND
   the app id in android/app/src/main/AndroidManifest.xml with the
   real ids from your AdMob account, and set isTesting = false.
   ============================================================ */
const ADS = {
  interstitialId: 'ca-app-pub-8892489378986653/5383695321', // Huelly interstitial
  rewardedId:     'ca-app-pub-8892489378986653/5192123632', // Huelly rewarded
  isTesting: false,                                           // real ads in production

  _plugin: null,
  _interstitialReady: false,
  _rewardedReady: false,
  _gamesSinceInterstitial: 0,
  INTERSTITIAL_EVERY: 2,   // show at most once per this many finished games

  get available(){ return !!this._plugin; },
  rewardedReady(){ return this.available && this._rewardedReady; },

  async init(){
    const Cap = window.Capacitor;
    if (!Cap || !Cap.isNativePlatform || !Cap.isNativePlatform() ||
        !Cap.Plugins || !Cap.Plugins.AdMob) return;   // browser / plugin absent → no-op
    this._plugin = Cap.Plugins.AdMob;
    try {
      await this._plugin.initialize({ initializeForTesting: this.isTesting });
      this._plugin.addListener('interstitialAdLoaded',       () => { this._interstitialReady = true; });
      this._plugin.addListener('interstitialAdFailedToLoad', () => { this._interstitialReady = false; });
      this._plugin.addListener('interstitialAdDismissed',    () => { this._interstitialReady = false; this._prepInterstitial(); });
      this._plugin.addListener('onRewardedVideoAdLoaded',       () => { this._rewardedReady = true; });
      this._plugin.addListener('onRewardedVideoAdFailedToLoad', () => { this._rewardedReady = false; });
      this._plugin.addListener('onRewardedVideoAdDismissed',    () => { this._rewardedReady = false; this._prepRewarded(); });
      this._prepInterstitial();
      this._prepRewarded();
    } catch(e){ this._plugin = null; }
  },

  async _prepInterstitial(){ try { await this._plugin.prepareInterstitial({ adId: this.interstitialId }); } catch(e){ this._interstitialReady = false; } },
  async _prepRewarded(){     try { await this._plugin.prepareRewardVideoAd({ adId: this.rewardedId });   } catch(e){ this._rewardedReady = false; } },

  /* A natural-break interstitial, capped so it never feels spammy. */
  async maybeShowInterstitial(){
    if (!this.available) return;
    if (++this._gamesSinceInterstitial < this.INTERSTITIAL_EVERY) return;
    if (!this._interstitialReady) return;
    this._gamesSinceInterstitial = 0;
    try { await this._plugin.showInterstitial(); } catch(e){ this._prepInterstitial(); }
  },

  /* Show a rewarded video; onReward(true) only if the user actually earned it. */
  async showRewarded(onReward){
    if (!this.rewardedReady()){ onReward(false); return; }
    let earned = false;
    const r = await this._plugin.addListener('onRewardedVideoAdReward',    () => { earned = true; });
    const d = await this._plugin.addListener('onRewardedVideoAdDismissed', () => { r.remove(); d.remove(); onReward(earned); });
    try { await this._plugin.showRewardVideoAd(); }
    catch(e){ r.remove(); d.remove(); onReward(false); }
  },
};

/* ============================================================
   AUDIO — tiny synth blips (no assets needed)
   ============================================================ */
let AC = null;
function beep(freq, dur=0.08, type='square', vol=0.05){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
  }catch{}
}

/* ============================================================
   GAME
   ============================================================ */
function startGame(lvl, diff){
  const d = CONFIG.DIFFS[diff];
  G = {
    lvl, diff,
    seqLen: CONFIG.seqLen(lvl),
    palette: CONFIG.COLORS.slice(0, CONFIG.colorCount(lvl, diff)),
    lives: d.lives,
    timeLeft: CONFIG.levelTime(lvl),
    fallTime: CONFIG.fallTime(lvl, diff),
    score: 0,
    target: [], playerArr: [],
    y: 0, maxY: 1,
    running: true, locked: false, lastT: null,
    boost: player.boost || 1,
    reviveUsed: false,   // a rewarded-ad revive may be offered once per game
  };
  $('hud-level').textContent = lvl;
  $('hud-score').textContent = '0';
  $('spd-btn').textContent = G.boost + '×';
  updateLives(); buildInputUI(); show('game');
  requestAnimationFrame(() => { spawnStrip(); G.lastT = null; requestAnimationFrame(tick); });
}

function updateLives(){ $('hud-lives').textContent = '❤'.repeat(G.lives) || '—'; }

/* Speed booster — tap to cycle 1× → 1.5× → 2× → 3× at any moment during play.
   Higher boost = faster fall AND points multiplied by the boost. */
$('spd-btn').onclick = () => {
  if (!G) return;
  const steps = CONFIG.SPEED_BOOSTS;
  G.boost = steps[(steps.indexOf(G.boost) + 1) % steps.length];
  $('spd-btn').textContent = G.boost + '×';
  player.boost = G.boost; savePlayer();   // remembered for next games
  beep(520 + G.boost*120, .06);
};

function buildInputUI(){
  const pg = $('player-grid'); pg.innerHTML = ''; pg.className = '';
  for (let i=0;i<G.seqLen;i++){ const s=document.createElement('div'); s.className='slot'; pg.appendChild(s); }
  const pal = $('palette'); pal.innerHTML = '';
  G.palette.forEach(color => {
    const b = document.createElement('button');
    b.className = 'pal-btn'; b.style.background = color;
    b.setAttribute('aria-label','color '+color);
    b.onclick = () => tapColor(color);
    pal.appendChild(b);
  });
}

function spawnStrip(){
  const old = $('target-strip'); if (old) old.remove();
  // Extreme: the color panel re-arranges itself before every new strip
  if (CONFIG.DIFFS[G.diff].shuffle){
    for (let i = G.palette.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [G.palette[i], G.palette[j]] = [G.palette[j], G.palette[i]];
    }
    buildInputUI();
  }
  G.target = Array.from({length:G.seqLen}, () => G.palette[Math.floor(Math.random()*G.palette.length)]);
  G.playerArr = []; renderPlayerGrid();
  const strip = document.createElement('div');
  strip.className='strip'; strip.id='target-strip';
  G.target.forEach(c => { const cell=document.createElement('div'); cell.className='cell'; cell.style.background=c; strip.appendChild(cell); });
  $('playfield').appendChild(strip);
  G.y = -40;
  G.maxY = $('playfield').clientHeight - 44;   // where the strip "lands"
  strip.style.top = G.y + 'px';
}

function tick(t){
  if (!G || !G.running) return;
  if (G.lastT == null) G.lastT = t;
  const dt = Math.min((t - G.lastT)/1000, 0.05);
  G.lastT = t;

  // timer
  G.timeLeft -= dt;
  const tl = Math.max(0, Math.ceil(G.timeLeft));
  $('hud-timer').textContent = tl;
  $('hud-timer').classList.toggle('low', tl <= 10);
  if (G.timeLeft <= 0) return endGame(true);

  // descend
  if (!G.locked){
    G.y += ($('playfield').clientHeight / G.fallTime) * G.boost * dt;
    const strip = $('target-strip');
    if (strip) strip.style.top = G.y + 'px';
    if (G.y >= G.maxY) stripLanded();
  }
  requestAnimationFrame(tick);
}

function stripLanded(){
  G.locked = true;
  G.lives--; updateLives(); beep(110, .25, 'sawtooth', .08);
  $('flash').className='red'; setTimeout(()=>$('flash').className='',400);
  $('app').classList.add('shake'); setTimeout(()=>$('app').classList.remove('shake'),400);
  if (G.lives <= 0){
    G.running = false;                              // freeze the loop while we decide
    setTimeout(() => offerContinueOrEnd(), 450);
    return;
  }
  setTimeout(()=>{ if(G && G.running){ spawnStrip(); G.locked=false; } }, 550);
}

/* Out of lives: offer a rewarded-ad revive if one is ready (once per game),
   otherwise just end. Admin test runs never see ads. */
function offerContinueOrEnd(){
  if (!G) return;
  if (!adminMode && !G.reviveUsed && ADS.rewardedReady()){
    $('continue-overlay').classList.add('show');
  } else {
    endGame(false);
  }
}
function reviveGame(){
  if (!G) return;
  G.reviveUsed = true;
  G.lives = 1; updateLives();
  G.running = true; G.locked = false; G.lastT = null;
  const s = $('target-strip'); if (s) s.remove();
  spawnStrip();
  requestAnimationFrame(tick);
}
$('btn-continue').onclick = () => {
  $('continue-overlay').classList.remove('show');
  ADS.showRewarded(earned => { if (earned && G) reviveGame(); else endGame(false); });
};
$('btn-giveup').onclick = () => { $('continue-overlay').classList.remove('show'); endGame(false); };

/* ---------- player input ---------- */
function tapColor(color){
  if (!G || !G.running || G.locked) return;
  if (G.playerArr.length >= G.seqLen) return;
  G.playerArr.push(color); beep(440 + G.playerArr.length*40, .05);
  renderPlayerGrid();
  if (G.playerArr.length === G.seqLen){
    if (checkMatch(G.playerArr, G.target)) fire();
    else { $('player-grid').classList.add('match-bad'); beep(160,.12); setTimeout(()=>$('player-grid').classList.remove('match-bad'),320); }
  }
}
$('btn-undo').onclick = () => { if(G&&G.running&&!G.locked&&G.playerArr.length){ G.playerArr.pop(); renderPlayerGrid(); } };
$('btn-clear').onclick = () => { if(G&&G.running&&!G.locked){ G.playerArr=[]; renderPlayerGrid(); } };

function renderPlayerGrid(){
  const slots = $('player-grid').children;
  for (let i=0;i<slots.length;i++){
    if (i < G.playerArr.length){ slots[i].className='slot filled'; slots[i].style.background=G.playerArr[i]; }
    else { slots[i].className='slot'; slots[i].style.background=''; }
  }
}

function checkMatch(playerArray, targetArray){
  if (playerArray.length !== targetArray.length) return false;
  return playerArray.every((c,i) => c === targetArray[i]);
}

/* ---------- fire! ---------- */
function fire(){
  G.locked = true;
  const pf = $('playfield');
  const heightFrac = Math.max(0, Math.min(1, 1 - G.y / G.maxY));
  const pts = Math.round(CONFIG.points(heightFrac, G.lvl, G.diff) * G.boost);
  G.score += pts; $('hud-score').textContent = G.score;

  $('player-grid').classList.add('match-ok');
  beep(660,.07); setTimeout(()=>beep(880,.07),70); setTimeout(()=>beep(1320,.1),140);

  // projectile: a copy of the matched strip flies up from the bottom
  const proj = document.createElement('div');
  proj.className='strip'; proj.id='fire-strip';
  G.target.forEach(c=>{ const cell=document.createElement('div'); cell.className='cell'; cell.style.background=c; proj.appendChild(cell); });
  proj.style.top = (pf.clientHeight - 40) + 'px';
  pf.appendChild(proj);

  // particle trail
  for (let i=0;i<14;i++){
    const p=document.createElement('div'); p.className='particle';
    p.style.background = G.target[Math.floor(Math.random()*G.target.length)];
    p.style.left = (10 + Math.random()*80) + '%';
    p.style.top  = (G.y + Math.random()*(pf.clientHeight - G.y - 40)) + 'px';
    pf.appendChild(p); setTimeout(()=>p.remove(),550);
  }

  requestAnimationFrame(()=>{ proj.style.top = G.y + 'px'; });
  setTimeout(()=>{
    proj.remove();
    const strip = $('target-strip'); if (strip) strip.remove();
    const boom=document.createElement('div'); boom.className='boom';
    boom.textContent='+'+pts;
    boom.style.top=Math.max(G.y,10)+'px'; boom.style.left='50%'; boom.style.transform='translateX(-50%)';
    pf.appendChild(boom); setTimeout(()=>boom.remove(),650);
    $('flash').className='green'; setTimeout(()=>$('flash').className='',350);
    $('player-grid').classList.remove('match-ok');
    if (G && G.running){ spawnStrip(); G.locked=false; }
  }, 240);
}

/* ---------- end / quit ---------- */
$('btn-quit').onclick = () => { if(G){ G.running=false; G=null; } show('levels'); };

/* `survived` = the clock ran out with lives to spare. That alone is not enough
   to clear a level: on Slow the early levels hand out more lives than there are
   strips, so idling through level 1 without a single tap used to count as a win.
   Clearing also requires landing at least one match. */
async function endGame(survived){
  G.running = false;
  $('continue-overlay').classList.remove('show');
  const {lvl, diff, score} = G;
  const key = lvl+':'+diff;
  const won = survived && score > 0;

  $('result-title').textContent = won ? t('levelDone') : t('gameOver');
  $('result-title').style.color = won ? 'var(--good)' : 'var(--bad)';
  const subVars = { n: lvl, diff: t('diff_'+diff) };
  $('result-sub').textContent = won
    ? t('subCleared', subVars)
    : survived ? t('subNoMatch', subVars)
               : t('subOutOfLives', subVars);
  $('result-score').textContent = score.toLocaleString();

  let bestNote = '';
  if (adminMode){
    bestNote = t('adminNote');
  } else if (won){
    // Compare against null, not 0: `?? 0` meant a first clear worth 0 points
    // failed the `score > prev` test and was never recorded, so the level stayed
    // star-less and still read "no scores yet".
    const prev = player.best[key];
    if (prev == null || score > prev){
      player.best[key] = score;
      bestNote = prev != null ? t('newBestWas', { prev }) : t('newBest');
    } else {
      bestNote = t('best', { n: prev });
    }
    if (lvl >= player.unlocked && lvl < CONFIG.LEVEL_COUNT) player.unlocked = lvl + 1;
    await savePlayer();
  } else if (survived){
    bestNote = t('needAMatch');
  } else {
    bestNote = player.best[key] != null ? t('best', { n: player.best[key] }) : t('finishToBank');
  }
  $('result-best').textContent = bestNote;
  $('btn-next').style.display = (won && lvl < CONFIG.LEVEL_COUNT) ? 'block' : 'none';
  $('btn-next').onclick = () => openDiff(lvl+1);
  $('btn-retry').onclick = () => startGame(lvl, diff);
  G = null;
  show('result');
  if (!adminMode) ADS.maybeShowInterstitial();   // capped natural-break ad
}
$('btn-to-levels').onclick = () => { renderLevels(); show('levels'); };

/* ============================================================
   LEADERBOARD (shared across all players of this app)
   ============================================================ */
$('btn-lb').onclick = async () => {
  show('lb');
  const list = $('lb-list');
  list.innerHTML = '<div class="lb-empty">' + t('loading') + '</div>';
  // Prefer the real global board; fall back to the local one when offline.
  let rows = await cloudLeaderboard(50);
  if (!rows){
    const keys = await store.list('lb:', true);
    rows = [];
    for (const k of keys.slice(0,100)){
      const v = await store.get(k, true);
      if (v && v.nick) rows.push(v);
    }
    rows.sort((a,b)=>b.total-a.total);
  }
  list.innerHTML = rows.length ? '' : '<div class="lb-empty">' + t('lbEmpty') + '</div>';
  rows.slice(0,50).forEach((r,i)=>{
    const div = document.createElement('div');
    div.className = 'lb-row' + (i===0?' top1':'') + (r.nick===player.nick?' me':'');
    div.innerHTML = `<span class="rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</span>
                     <span class="nick"></span><span class="pts">${r.total.toLocaleString()}</span>`;
    div.querySelector('.nick').textContent = r.nick;
    list.appendChild(div);
  });
};
$('btn-lb-back').onclick = () => show('levels');

/* ============================================================
   BOOT — restore saved player if there is one
   ============================================================ */
document.addEventListener('visibilitychange', () => { if (G) G.lastT = null; });

/* Language is resolved synchronously, before the first paint, so the player
   never sees a flash of the wrong language: a saved choice wins, otherwise
   follow the device, otherwise fall back to English. */
function detectLang(){
  try {
    const saved = localStorage.getItem(LS_PREFIX + 'lang');
    if (saved && LANGS.includes(saved)) return saved;
  } catch {}
  const nav = (navigator.languages && navigator.languages[0]) || navigator.language || '';
  return nav.toLowerCase().startsWith('tr') ? 'tr' : 'en';
}

function setLang(next){
  lang = next;
  try { localStorage.setItem(LS_PREFIX + 'lang', lang); } catch {}
  applyI18n();
  if (player) renderLevels();   // the player chip is built in JS, not markup
}

const toggleLang = () => setLang(LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]);
$('btn-lang').onclick = toggleLang;
$('btn-lang-signup').onclick = toggleLang;

lang = detectLang();
applyI18n();
ADS.init();   // no-op in a browser; sets up AdMob in the native app

(async () => {
  const saved = await store.get('player');
  if (saved && saved.nick){ player = saved; renderLevels(); show('levels'); }
})();
</script>
